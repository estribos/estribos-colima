<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estribos Colima Bemon | Estribos de Alambrón Antisísmicos</title>
  <style>
    :root {
      --navy: #0A192F;
      --navy-light: #112240;
      --orange: #F97316;
      --orange-hover: #EA580C;
      --white: #FFFFFF;
      --gray-bg: #F4F6F9;
      --gray-text: #334155;
      --border: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--gray-bg);
      color: var(--navy);
      line-height: 1.5;
    }

    /* Header */
    header {
      background-color: var(--navy);
      color: var(--white);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 3px solid var(--orange);
    }

    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--white);
    }

    .brand-tag {
      font-size: 0.8rem;
      color: #CBD5E1;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--white);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: var(--orange);
    }

    .btn-wa {
      background-color: var(--orange);
      color: var(--white);
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    .btn-wa:hover {
      background-color: var(--orange-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background-color: transparent;
      color: var(--white);
      border: 2px solid var(--white);
      border-radius: 8px;
      padding: 11px 18px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-outline:hover {
      background-color: var(--white);
      color: var(--navy);
    }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
      color: var(--white);
      padding: 48px 20px;
    }

    .hero-grid {
      max-width: 1140px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background-color: rgba(249, 115, 22, 0.18);
      color: #FDBA74;
      border: 1px solid var(--orange);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
      margin-bottom: 16px;
      font-weight: 800;
    }

    .hero h1 span {
      color: var(--orange);
    }

    .hero p {
      font-size: 1.05rem;
      color: #E2E8F0;
      margin-bottom: 24px;
      max-width: 580px;
    }

    .hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .highlights {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .highlight-box {
      background-color: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 12px;
    }

    .highlight-box strong {
      display: block;
      color: var(--orange);
      font-size: 0.95rem;
      margin-bottom: 2px;
    }
